[project]
name = "meridian-ingestion"
version = "0.1.0"
description = "Ingestion service landing source data into the Meridian data lake"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0", "moto[s3]>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meridian_ingestion = ["contracts/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
