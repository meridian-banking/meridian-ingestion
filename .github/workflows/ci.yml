name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.5.0
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  contracts-valid:
    # Contracts are data, not code — make sure they stay parseable JSON.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate contract JSON files
        run: |
          python - <<'PY'
          import json, pathlib, sys
          required = {"entity", "version", "columns", "primary_key"}
          bad = []
          for p in pathlib.Path("src/meridian_ingestion/contracts").glob("*.json"):
              data = json.loads(p.read_text())
              missing = required - data.keys()
              if missing:
                  bad.append(f"{p.name}: missing {sorted(missing)}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all contracts valid")
          PY
